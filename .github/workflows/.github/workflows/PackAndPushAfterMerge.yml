name: PackAndPushAfterMerge

on:
  push:
    branches:    
      - master

jobs:
  build:
    name: ReleaseTheTask
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v1
    
    - name: Get version number
      id: vars
      shell: pwsh
      run: |
        $version = ([xml]($tmp = Get-Content -Path 'Frends.Test.TestWorkflow/Frends.Test.TestWorkflow.csproj')).SelectSingleNode("Project/PropertyGroup/Version").InnerText
        echo "::set-output name=version_number::$version"

    - name: Pack release version of task
      run: dotnet pack Frends.Test.TestWorkflow\Frends.Test.TestWorkflow.csproj --configuration Release --include-source 
      
    - name: Push NuGet package to the (prod) feed
      run: dotnet nuget push Frends.Test.TestWorkflow\bin\Release\Frends.Test.TestWorkflow.*.nupkg --api-key ${{ secrets.COMMUNITY_FEED_API_KEY }} --source https://www.myget.org/F/frends-community/api/v2/package
      if: ${{ secrets.COMMUNITY_FEED_API_KEY != '' }}
    
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.vars.outputs.version_number }}
        release_name: Release ${{ steps.vars.outputs.version_number }}
        body: |
          You can install the task via frends UI Task View or you can find the NuGet package from https://www.myget.org/F/frends-community/api/v2/package/Frends.Test.TestWorkflow/${{ steps.vars.outputs.version_number }}
        draft: false
        prerelease: false
